<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Data Table with IndexedDB</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23008080'/%3E%3Crect x='3' y='4' width='10' height='9' fill='%23c0c0c0'/%3E%3Crect x='3' y='4' width='10' height='2' fill='%23000080'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@400;500;700&display=swap">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="window main-window">
        <div class="title-bar">
            <h1 class="title-bar-text">Example Product List Web App</h1>
            <div class="title-bar-controls">
                <button class="title-bar-btn" type="button" aria-label="Minimize">_</button>
                <button class="title-bar-btn" type="button" aria-label="Maximize">&#9633;</button>
                <button class="title-bar-btn" type="button" aria-label="Close">&#10005;</button>
            </div>
        </div>

        <div class="window-body">
            <div class="toolbar">
                <button id="openModalBtn" type="button">+ Add Product</button>
            </div>

            <table id="productsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
              
                </tbody>
            </table>
        </div>

        <div class="status-bar">
            <span id="statusText">Ready</span>
        </div>
    </div>

    <footer class="app-footer">
        <p class="footer-name">Valenzuela Cruz Emmanuel</p>
        <p class="footer-meta">Grupo 9no C &middot; Desarrollo Web Integral &middot; GitHub: Agent3835</p>
    </footer>

    <!-- Modal: formulario para agregar productos -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="window modal-window" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="title-bar">
                <span class="title-bar-text" id="modalTitle">Add New Product</span>
                <div class="title-bar-controls">
                    <button class="title-bar-btn" id="closeModalBtn" type="button" aria-label="Close">&#10005;</button>
                </div>
            </div>

            <div class="window-body">
                <div class="formContainer">
                    <label for="name">Product Name:</label>
                    <input type="text" id="name" placeholder="Enter product name">
                    
                    <label for="price">Price:</label>
                    <input type="number" id="price" placeholder="Enter product price" min="1">
                    
                    <div class="modal-buttons">
                        <button id="addProduct" type="button">Add Product</button>
                        <button id="cancelModalBtn" type="button">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Barra de tareas estilo Windows 95 -->
    <div class="taskbar">
        <button class="start-button" id="startButton" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="start-flag">&#9632;</span>Start
        </button>

        <div class="start-menu" id="startMenu" role="menu" aria-labelledby="startButton" hidden>
            <div class="start-menu-banner">
                <p class="start-menu-name">Valenzuela Cruz Emmanuel</p>
                <p class="start-menu-user">Agent3835</p>
            </div>
            <ul class="start-menu-list">
                <li><a class="start-menu-item" id="menuNewProduct" href="#productsTable" role="menuitem">Products</a></li>
                <li><a class="start-menu-item" href="https://github.com/Agent3835/versionamiento-valenzuela-cruz" role="menuitem" target="_blank" rel="noopener">Repository</a></li>
                <li><a class="start-menu-item" href="https://github.com/Agent3835" role="menuitem" target="_blank" rel="noopener">GitHub Profile</a></li>
            </ul>
        </div>

        <div class="taskbar-tray">
            <span class="tray-clock" id="taskbarClock">--:--</span>
        </div>
    </div>
    <script src="functions.js"></script>
</body>
</html>
